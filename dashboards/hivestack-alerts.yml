groups:
  - name: hivestack-alerts
    rules:
      - alert: HighCPU
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 90% for 5 minutes. Current: {{ $value }}%"

      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 90% for 5 minutes. Current: {{ $value }}%"

      - alert: HostDown
        expr: up{job="hivestack-node"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HiveStack node {{ $labels.instance }} is down"
          description: "Node has been unreachable for 1 minute."

      - alert: VMFailoverFailed
        expr: increase(hivestack_failover_failed_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "VM failover failed"
          description: "Failed failover attempts detected in the last 5 minutes."

      - alert: ComplianceDrift
        expr: increase(hivestack_compliance_drift_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Compliance drift detected"
          description: "Compliance drift events detected in the last hour."

      - alert: DatabaseConnectionFailed
        expr: hivestack_db_connection_active == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Database connection lost"
          description: "HiveStack Manager cannot connect to PostgreSQL."

      - alert: CertificateExpiry
        expr: (hivestack_cert_expiry_timestamp - time()) / 86400 < 30
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expiring soon"
          description: "Certificate expires in {{ $value }} days. Renew before expiry."
