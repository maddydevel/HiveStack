# HiveStack Container Compose
# Runs Manager + Node Agent + PostgreSQL in containers
#
# Usage:
#   docker compose up -d
#   podman-compose up -d
#
# View logs:
#   docker compose logs -f manager
#
# Scale nodes:
#   docker compose up -d --scale node=3

version: "3.8"

services:
  # PostgreSQL database for HiveStack
  postgres:
    image: postgres:15-alpine
    container_name: hivestack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hivestack
      POSTGRES_USER: hivestack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hivestack-secure-password-change-me}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hivestack-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivestack"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # HiveStack Manager (REST API + gRPC control plane)
  manager:
    build:
      context: ../..
      dockerfile: appliance/Dockerfile
    image: hivestack:latest
    container_name: hivestack-manager
    restart: unless-stopped
    command: ["manager"]
    environment:
      HIVESTACK_CONFIG: /etc/hivestack/manager.yaml
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: hivestack
      POSTGRES_USER: hivestack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hivestack-secure-password-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-use-strong-random-secret}
    volumes:
      - manager-data:/var/lib/hivestack
      - manager-certs:/etc/hivestack/certs
      - manager-logs:/var/log/hivestack
      - ./config/manager.yaml:/etc/hivestack/manager.yaml:ro
    ports:
      - "8080:8080"   # REST API
      - "8443:8443"   # Manager gRPC
    networks:
      - hivestack-internal
      - hivestack-public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-kfs", "https://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # HiveStack Node Agent (libvirt/KVM management)
  node:
    build:
      context: ../..
      dockerfile: appliance/Dockerfile
    image: hivestack:latest
    restart: unless-stopped
    command: ["node"]
    privileged: true
    environment:
      HIVESTACK_CONFIG: /etc/hivestack/node.yaml
      MANAGER_ADDRESS: manager:8443
      NODE_ID: ${NODE_ID:-}
    volumes:
      - /dev/kvm:/dev/kvm
      - node-data:/var/lib/hivestack
      - node-certs:/etc/hivestack/certs
      - node-logs:/var/log/hivestack
      - libvirt-images:/var/lib/libvirt/images
      - ./config/node.yaml:/etc/hivestack/node.yaml:ro
    ports:
      - "9090"        # Node gRPC (dynamic host port)
    networks:
      - hivestack-internal
    depends_on:
      - manager
    healthcheck:
      test: ["CMD", "/opt/hivestack/bin/hive-node", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Prometheus Node Exporter (optional monitoring)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: hivestack-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    ports:
      - "9100:9100"
    networks:
      - hivestack-internal

volumes:
  postgres-data:
    driver: local
  manager-data:
    driver: local
  manager-certs:
    driver: local
  manager-logs:
    driver: local
  node-data:
    driver: local
  node-certs:
    driver: local
  node-logs:
    driver: local
  libvirt-images:
    driver: local

networks:
  hivestack-internal:
    driver: bridge
    internal: true
  hivestack-public:
    driver: bridge
