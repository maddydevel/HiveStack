name: Release Appliance

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.23"

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux]
        arch: [amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build binaries
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          OUTPUT="hivestack-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          go build -ldflags="-w -s -X main.version=${VERSION}" -o "dist/${OUTPUT}/hive-manager" ./cmd/hive-manager
          go build -ldflags="-w -s -X main.version=${VERSION}" -o "dist/${OUTPUT}/hive-node" ./node/
          go build -ldflags="-w -s -X main.version=${VERSION}" -o "dist/${OUTPUT}/hive" ./cmd/hive
          cd dist && tar -czf "${OUTPUT}.tar.gz" "${OUTPUT}" && sha256sum "${OUTPUT}.tar.gz" >> checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 7

  build-docker:
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: <_REDACTED> secrets.GITHUB_TOKEN
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/maddydevel/hivestack:${{ github.ref_name }}
            ghcr.io/maddydevel/hivestack:latest

  release:
    runs-on: ubuntu-latest
    needs: [build-binaries, build-docker]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          gh release create "${VERSION}" \
            --title "HiveStack ${VERSION}" \
            --generate-notes \
            artifacts/binaries-*/*
