name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: "1.26"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================================
  # Job 1: Verify tag and run final checks
  # ==========================================================================
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify tag matches version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "Release version: ${TAG}"
          echo "TAG_VERSION=${TAG}" >> $GITHUB_ENV

      - name: Run all tests
        run: |
          go mod download
          go test ./... -race -count=1

  # ==========================================================================
  # Job 2: Build release binaries (all platforms)
  # ==========================================================================
  build:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, suffix: linux-amd64 }
          - { goos: linux, goarch: arm64, suffix: linux-arm64 }
          - { goos: darwin, goarch: amd64, suffix: darwin-amd64 }
          - { goos: darwin, goarch: arm64, suffix: darwin-arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG_VERSION: ${{ env.TAG_VERSION }}
        run: |
          mkdir -p dist

          # Build Manager
          CGO_ENABLED=0 go build \
            -ldflags="-w -s -X main.version=${TAG_VERSION} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.gitCommit=${{ github.sha }}" \
            -o dist/hive-manager-${{ matrix.suffix }} ./cmd/hive-manager

          # Build Node Agent
          CGO_ENABLED=0 go build \
            -ldflags="-w -s -X main.version=${TAG_VERSION} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.gitCommit=${{ github.sha }}" \
            -o dist/hive-node-${{ matrix.suffix }} ./node/

          # Build CLI
          CGO_ENABLED=0 go build \
            -ldflags="-w -s -X main.version=${TAG_VERSION} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.gitCommit=${{ github.sha }}" \
            -o dist/hive-${{ matrix.suffix }} ./cmd/hive

      - name: Create archive
        env:
          TAG_VERSION: ${{ env.TAG_VERSION }}
        run: |
          cd dist
          for bin in hive-manager hive-node hive; do
            tar czf "hivestack-${TAG_VERSION}-${{ matrix.suffix }}.tar.gz" \
              "${bin}-${{ matrix.suffix }}" \
              -C ../ LICENSE \
            ../README.md \
            ../configs/manager.yaml.example \
            ../configs/node.yaml.example
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.suffix }}
          path: dist/*.tar.gz

  # ==========================================================================
  # Job 3: Build and push container images
  # ==========================================================================
  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: appliance/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.TAG_VERSION }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}

      - name: Sign container image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

  # ==========================================================================
  # Job 4: Create GitHub Release with artifacts
  # ==========================================================================
  release:
    runs-on: ubuntu-latest
    needs: [build, container]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: release-*

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: hivestack-${{ env.TAG_VERSION }}.spdx.json
          upload-artifact: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign release artifacts and SBOM
        env:
          TAG_VERSION: ${{ env.TAG_VERSION }}
        run: |
          find release-artifacts -name '*.tar.gz' -exec \
            cosign sign-blob --yes --bundle '{}.sigstore.json' '{}' \;
          cosign sign-blob --yes \
            --bundle "hivestack-${TAG_VERSION}.spdx.json.sigstore.json" \
            "hivestack-${TAG_VERSION}.spdx.json"

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --oneline --no-decorate)
          else
            CHANGELOG=$(git log --oneline --no-decorate ${LAST_TAG}..HEAD)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate release notes (gh-release-notes)
        id: release-notes
        run: |
          # Try gh-release-notes extension if available
          if gh extension list 2>/dev/null | grep -q "release-notes"; then
            gh release-notes ${{ github.ref_name }} > DETAILED_NOTES.md 2>/dev/null || true
          fi
          
          # Always create a comprehensive notes file
          if [ ! -f DETAILED_NOTES.md ]; then
            echo "## HiveStack ${{ env.TAG_VERSION }}" > DETAILED_NOTES.md
            echo "" >> DETAILED_NOTES.md
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              echo "### Changes since ${LAST_TAG}" >> DETAILED_NOTES.md
              echo "" >> DETAILED_NOTES.md
              git log --no-decorate ${LAST_TAG}..HEAD --format='- %s (%h)' >> DETAILED_NOTES.md
            else
              echo "### Changes" >> DETAILED_NOTES.md
              echo "" >> DETAILED_NOTES.md
              git log --no-decorate --format='- %s (%h)' >> DETAILED_NOTES.md
            fi
          fi
          
          echo "DETAILED_NOTES<<EOF" >> $GITHUB_OUTPUT
          cat DETAILED_NOTES.md >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install cosign (for tag signing)
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign git tag with cosign
        run: |
          # Create tag object hash and sign it
          TAG_SHA=$(git rev-parse ${{ github.ref_name }}^{})
          echo "${TAG_SHA}" > tag-sha.txt
          cosign sign-blob --yes \
            --output-signature "hivestack-${{ env.TAG_VERSION }}-tag.sig" \
            --output-certificate "hivestack-${{ env.TAG_VERSION }}-tag.cert" \
            tag-sha.txt
          echo "Tag signed with cosign keyless signing"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "HiveStack ${{ env.TAG_VERSION }}"
          body: |
            ## HiveStack ${{ env.TAG_VERSION }}

            ${{ steps.release-notes.outputs.DETAILED_NOTES }}

            ### Container Images
            - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_VERSION }}`
            - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest`

            ### Installation
            ```bash
            # Pull container image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_VERSION }}

            # Or download binary release
            # See attached assets for your platform
            ```

            ### Quick Start
            ```bash
            # Run with docker compose
            docker compose -f appliance/docker-compose.yaml up -d
            ```

            ### Verification
            Release artifacts and the SBOM are signed with keyless [cosign](https://docs.sigstore.dev/cosign/overview/) signatures.
            ```bash
            # Verify a downloaded artifact against its .sigstore.json bundle
            cosign verify-blob \
              --bundle hivestack-${{ env.TAG_VERSION }}-linux-amd64.tar.gz.sigstore.json \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              hivestack-${{ env.TAG_VERSION }}-linux-amd64.tar.gz

            # Verify the container image
            cosign verify \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_VERSION }}
            ```

            See [docs/RELEASE.md](docs/RELEASE.md) for full release notes and upgrade instructions.
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.tar.gz.sigstore.json
            hivestack-${{ env.TAG_VERSION }}.spdx.json
            hivestack-${{ env.TAG_VERSION }}.spdx.json.sigstore.json
            hivestack-${{ env.TAG_VERSION }}-tag.sig
            hivestack-${{ env.TAG_VERSION }}-tag.cert
